<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TGS Approvals</title><style>body{margin:0;background:#f4f3ef;font:15px system-ui;color:#1b2940}header{background:#101b32;color:white;padding:22px;display:flex;justify-content:space-between;flex-wrap:wrap;border-bottom:3px solid #c9a45c}main{max-width:1000px;margin:25px auto;padding:0 15px}.card,.item{background:white;border:1px solid #e7e2d8;border-radius:12px;padding:16px;margin:12px 0}.muted{color:#738096;font-size:13px}button{padding:10px 14px;margin:6px 5px 0 0;border:0;border-radius:8px;background:#d9bd7b;font-weight:800}.reject{background:#f3dddd;color:#812f2f}.msg{background:#fff8e9;padding:12px;display:none}</style></head><body><header><b>TGS · Registration Approvals</b><nav><a href="./student-linking.html" style="color:#ead29b;margin-right:16px">Link Student Accounts</a><a href="./admin.html" style="color:#ead29b">Admin Panel</a></nav></header><main><div id="msg" class="msg"></div><section class="card"><h2>Pending Registrations</h2><p class="muted">Only approved administrators can approve student, teacher or additional admin accounts.</p><div id="pending">Loading…</div></section><section class="card"><h2>Accounts</h2><div id="all"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script><script src="./supabase-config.js"></script><script>(async()=>{const sb=supabase.createClient(TGS_SUPABASE_URL,TGS_SUPABASE_PUBLISHABLE_KEY),$=id=>document.getElementById(id),say=t=>{$('msg').textContent=t;$('msg').style.display='block'},esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const {data:{session}}=await sb.auth.getSession();if(!session){location.href='./auth.html?role=admin';return}const {data:me}=await sb.from('profiles').select('role,approval_status').eq('id',session.user.id).single();if(!me||me.role!=='admin'||me.approval_status!=='approved'){await sb.auth.signOut();location.href='./auth.html?role=admin';return}async function load(){const {data,error}=await sb.from('profiles').select('id,email,full_name,role,requested_role,approval_status,created_at').order('created_at',{ascending:false});if(error){say(error.message);return}const pending=data.filter(x=>x.approval_status==='pending');$('pending').innerHTML=pending.length?pending.map(x=>'<div class="item"><b>'+esc(x.full_name)+'</b><div>'+esc(x.email)+' · Requested: '+esc(x.requested_role)+'</div><div class="muted">'+new Date(x.created_at).toLocaleString()+'</div><button data-a="'+x.id+'">Approve</button><button class="reject" data-r="'+x.id+'">Reject</button></div>').join(''):'No pending registrations.';$('all').innerHTML=data.filter(x=>x.approval_status!=='pending').map(x=>'<div class="item">'+esc(x.full_name)+' · '+esc(x.email)+' · '+esc(x.role)+' · '+esc(x.approval_status)+'</div>').join('');document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>setStatus(b.dataset.a,'approved'));document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>setStatus(b.dataset.r,'rejected'))}async function setStatus(id,status){const {data:r,error:re}=await sb.from('profiles').select('requested_role').eq('id',id).single();if(re){say(re.message);return}const patch={approval_status:status,approved_by:session.user.id,approved_at:status==='approved'?new Date().toISOString():null};if(status==='approved')patch.role=r.requested_role||'student';const {error}=await sb.from('profiles').update(patch).eq('id',id);if(error){say(error.message);return}say(status==='approved'?'Account approved.':'Registration rejected.');load()}load()})();</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script><style>
