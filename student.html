<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TGS Student Portal</title><style>
:root{--navy:#101b32;--gold:#c9a45c;--ink:#18243a;--muted:#718096;--line:#e8e3d8;--bg:#f5f3ee}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0%,#eee4ce 0,transparent 30%),var(--bg);color:var(--ink);font:15px Inter,system-ui,Arial;line-height:1.6}.top{background:linear-gradient(120deg,#0d172b,#1c3154 68%,#263b5d);color:white;padding:24px max(18px,calc((100% - 1080px)/2));display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--gold)}.top b{letter-spacing:2px}.top small{display:block;color:#e4d2aa;font-size:10px;letter-spacing:2px;margin-top:4px}button{cursor:pointer;padding:11px 16px;background:linear-gradient(120deg,#c5a15b,#e1c582);color:#17233b;border:0;border-radius:10px;font-weight:800}.wrap{max-width:1080px;margin:26px auto;padding:0 17px 45px}.panel{background:white;padding:23px;border:1px solid var(--line);border-radius:17px;margin:15px 0;box-shadow:0 10px 30px #18243a0a}#status{border-left:4px solid var(--gold);font-size:13px;color:#536176}#welcome{font:500 27px Georgia;color:var(--navy);margin:0}#class{color:#8b6d38;font-size:13px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:17px;border:1px solid var(--line);border-radius:13px;background:#fdfcf9}.stat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.7px}.stat strong{display:block;font:600 27px Georgia;color:var(--navy);margin-top:7px}h3{font-size:17px;color:var(--navy);margin:0 0 15px;padding-bottom:12px;border-bottom:1px solid var(--line)}article{padding:15px;margin:10px 0;border:1px solid var(--line);border-radius:12px;background:#fdfcf9}article b{color:#1b2d4a}article p,article small{color:var(--muted);font-size:13px}.grade{font-weight:800;color:#987638}@media(max-width:600px){.top{padding:18px}.wrap{padding:0 12px 35px}.panel{padding:18px}.stats{grid-template-columns:1fr 1fr}#welcome{font-size:23px}}
</style></head><body><header class="top"><div><b>THE GENERATION SCHOOL</b><small>STUDENT LEARNING SPACE</small></div><button id="logout">Logout</button></header><main class="wrap"><div id="status" class="panel">Checking secure login…</div><section class="panel"><h2 id="welcome">Student Dashboard</h2><p id="class"></p></section><section class="panel"><h3>My Performance</h3><div class="stats"><div class="stat"><small>Exams</small><strong id="examCount">—</strong></div><div class="stat"><small>Average</small><strong id="average">—</strong></div><div class="stat"><small>Overall</small><strong id="grade">—</strong></div></div></section><section class="panel"><h3>My Homework</h3><div id="homework">Loading…</div></section><section class="panel"><h3>My Results</h3><div id="results">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db,student;
async function start(){if(!window.supabase||!TGS_SUPABASE_URL||!TGS_SUPABASE_PUBLISHABLE_KEY)throw Error('Secure connection unavailable.');db=supabase.createClient(TGS_SUPABASE_URL,TGS_SUPABASE_PUBLISHABLE_KEY);const {data:{user},error}=await db.auth.getUser();if(error||!user){location.replace('./index.html');return}const p=await db.from('profiles').select('role').eq('id',user.id).maybeSingle();if(p.error||!p.data||p.data.role!=='student'){if(p.data?.role==='admin')location.replace('./admin.html');else if(p.data?.role==='teacher')location.replace('./teacher.html');else location.replace('./index.html');return}const s=await db.from('students').select('id,full_name,class_name,roll_number').eq('user_id',user.id).maybeSingle();if(s.error||!s.data){$('status').textContent='Your student record is not linked yet. Please contact school administration.';return}student=s.data;$('status').textContent='Securely connected to your school records.';$('welcome').textContent='Welcome, '+esc(student.full_name);$('class').textContent=esc(student.class_name)+' · Roll No: '+esc(student.roll_number);const [h,r]=await Promise.all([db.from('homework').select('subject,title,details,due_date,created_at').eq('class_name',student.class_name).order('created_at',{ascending:false}),db.from('exam_results').select('obtained_marks,remarks,exams(title,subject,total_marks,exam_date)').eq('student_id',student.id).order('created_at',{ascending:false})]);if(h.error||r.error)throw Error('Could not load homework or results. '+(h.error||r.error).message);$('homework').innerHTML=h.data.map(x=>'<article><b>'+esc(x.subject)+' — '+esc(x.title)+'</b><p>'+esc(x.details)+'</p><small>Due: '+esc(x.due_date||'Not set')+'</small></article>').join('')||'<p class="muted">No homework assigned yet.</p>';const rows=r.data.filter(x=>x.exams),pct=rows.map(x=>Number(x.exams.total_marks)>0?Number(x.obtained_marks)/Number(x.exams.total_marks)*100:null).filter(x=>x!==null),avg=pct.length?pct.reduce((a,b)=>a+b,0)/pct.length:null;$('examCount').textContent=rows.length;$('average').textContent=avg===null?'—':avg.toFixed(1)+'%';$('grade').textContent=avg===null?'—':avg>=80?'Excellent':avg>=60?'Good':avg>=40?'Needs focus':'Needs support';$('results').innerHTML=rows.map(x=>{const total=Number(x.exams.total_marks),got=Number(x.obtained_marks),percent=total?got/total*100:0;return '<article><b>'+esc(x.exams.title)+' — '+esc(x.exams.subject)+'</b><p>'+got+' / '+total+' marks · <span class="grade">'+percent.toFixed(1)+'%</span></p><small>'+esc(x.remarks||'')+'</small></article>'}).join('')||'<p class="muted">Your results will appear here after the teacher publishes them.</p>'}
$('logout').onclick=async()=>{if(db)await db.auth.signOut();location.replace('./index.html')};start().catch(e=>$('status').textContent=e.message);
</script></body></html>
