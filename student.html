<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TGS Student Portal</title><style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f1f5f9;color:#172033}.top{background:#10213e;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:900px;margin:20px auto;padding:0 14px}.panel{background:white;padding:18px;border-radius:12px;margin:14px 0}button{padding:10px 15px;background:#1e40af;color:white;border:0;border-radius:8px}article{padding:12px 0;border-bottom:1px solid #ddd}.muted{color:#64748b}
:root{--navy:#101b32;--navy2:#1c3154;--gold:#c9a45c;--ink:#18243a;--muted:#718096;--line:#e8e3d8;--bg:#f5f3ee}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0%,#eee4ce 0,transparent 30%),var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
.top{position:relative;overflow:hidden;background:linear-gradient(120deg,#0d172b,#1c3154 68%,#263b5d);color:white;padding:24px max(20px,calc((100% - 1080px)/2));display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:3px solid var(--gold);box-shadow:0 12px 32px #101b3222}
.top:after{content:"TGS";position:absolute;right:9%;top:-38px;font-size:150px;font-weight:900;letter-spacing:-12px;color:#ffffff08;pointer-events:none}
.top b,.top button{position:relative;z-index:1}.top b{font-size:17px;letter-spacing:2px}
button{cursor:pointer;padding:10px 17px;background:linear-gradient(120deg,#c5a15b,#e1c582);color:#17233b;border:0;border-radius:10px;font-weight:800;box-shadow:0 5px 14px #0002;transition:.2s}button:hover{transform:translateY(-1px);filter:brightness(1.04)}
.wrap{max-width:1080px;margin:28px auto;padding:0 18px 50px}
.panel{background:#fff;padding:24px;border:1px solid var(--line);border-radius:17px;margin:16px 0;box-shadow:0 12px 35px #18243a0a}
#status{border-left:4px solid var(--gold);color:#536176;font-size:13px;background:#fffdf8}
#welcome{font-size:26px;letter-spacing:-.7px;color:var(--navy);margin:0 0 5px}
#class{display:inline-block;background:#f5f1e7;border:1px solid #ebe1cc;padding:8px 13px;border-radius:9px;color:#8b6d38;font-size:13px;font-weight:750;margin:8px 0 0}
section.panel h3{font-size:16px;color:var(--navy);margin:0 0 15px;padding-bottom:12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
section.panel h3:after{content:"";height:2px;width:35px;background:var(--gold);border-radius:4px}
article{padding:16px 17px;margin:11px 0;border:1px solid #e9e4d9;border-radius:13px;background:linear-gradient(120deg,#fff,#fcfbf8);box-shadow:0 4px 13px #18243a06;overflow-wrap:anywhere}
article b{color:#1b2d4a;font-size:14px}article p{color:#64748b;font-size:13px;margin:7px 0}article small{color:#9a7a3e;font-weight:700}
article a{color:#987332;font-weight:800;text-decoration:none}article a:hover{text-decoration:underline}
.muted{color:var(--muted)}
@media(max-width:600px){.top{padding:19px 16px}.top:after{font-size:100px;right:0}.top b{font-size:14px}.wrap{margin:17px auto;padding:0 12px 35px}.panel{padding:18px;border-radius:14px}#welcome{font-size:22px}}

</style></head><body><header class="top"><b>🎓 TGS Student Portal</b><button id="logout">Logout</button></header><main class="wrap"><div id="status" class="panel">Checking secure login…</div><section class="panel"><h2 id="welcome">Student Dashboard</h2><p id="class"></p></section><section class="panel"><h3>Homework</h3><div id="homework">Loading…</div></section><section class="panel"><h3>Study Materials</h3><div id="materials">Loading…</div></section><section class="panel"><h3>Announcements</h3><div id="announcements">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0"></script><script src="./supabase-config.js"></script><script>
function showLogin(){const box=document.getElementById('tgsLogin');if(box)box.style.display='flex'}

const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db,user,student;
async function start(){if(!window.supabase||!window.TGS_SUPABASE_URL||!window.TGS_SUPABASE_PUBLISHABLE_KEY)throw Error('Secure connection unavailable.');db=window.supabase.createClient(TGS_SUPABASE_URL,TGS_SUPABASE_PUBLISHABLE_KEY);const {data,error}=await db.auth.getUser();if(error||!data.user){showLogin();return}user=data.user;const p=await db.from('profiles').select('role,full_name').eq('id',user.id).maybeSingle();if(p.error||!p.data){await db.auth.signOut();location.replace('./index.html?v=20261031');return}if(p.data.role!=='student'){const routes={admin:'admin.html',teacher:'teacher.html',parent:'parent.html'};if(routes[p.data.role]){location.replace('./'+routes[p.data.role]+'?v=20261031');return}await db.auth.signOut();location.replace('./index.html?v=20261031');return}const s=await db.from('students').select('id,full_name,class_name,roll_number').eq('user_id',user.id).maybeSingle();if(s.error||!s.data){$('status').textContent='Your student record is not linked yet. Please contact school administration.';return}student=s.data;$('status').textContent='Securely connected to school records.';$('welcome').textContent='Welcome, '+esc(student.full_name);$('class').textContent=esc(student.class_name)+' · Roll No: '+esc(student.roll_number);const [h,m,a]=await Promise.all([db.from('homework').select('subject,title,details,due_date,created_at').eq('class_name',student.class_name).order('created_at',{ascending:false}),db.from('study_materials').select('subject,title,file_url,created_at').eq('class_name',student.class_name).order('created_at',{ascending:false}),db.from('announcements').select('title,body,audience,created_at').in('audience',['all','students']).order('created_at',{ascending:false})]);if(h.error||m.error||a.error)throw Error('Could not load school data.');$('homework').innerHTML=h.data.map(x=>'<article><b>'+esc(x.subject)+' — '+esc(x.title)+'</b><p>'+esc(x.details)+'</p><small>Due: '+esc(x.due_date||'Not set')+'</small></article>').join('')||'No homework assigned.';$('materials').innerHTML=m.data.map(x=>'<article><b>'+esc(x.subject)+' — '+esc(x.title)+'</b><p><a href="'+esc(x.file_url)+'" target="_blank" rel="noopener">Open material</a></p></article>').join('')||'No study materials shared.';$('announcements').innerHTML=a.data.map(x=>'<article><b>'+esc(x.title)+'</b><p>'+esc(x.body)+'</p></article>').join('')||'No announcements.'}
$('logout').onclick=async()=>{if(db)await db.auth.signOut();location.replace('index.html')};start().catch(e=>{$('status').textContent=e.message});

document.getElementById('tgsLoginForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('tgsLoginMsg');const btn=e.currentTarget.querySelector('button');btn.disabled=true;btn.textContent='SIGNING IN…';msg.textContent='';try{if(!db)db=window.supabase.createClient(window.TGS_SUPABASE_URL,window.TGS_SUPABASE_PUBLISHABLE_KEY);const {error}=await db.auth.signInWithPassword({email:document.getElementById('tgsEmail').value.trim(),password:document.getElementById('tgsPassword').value});if(error)throw error;location.reload()}catch(err){msg.textContent=err.message||'Sign in failed. Check your email and password.';btn.disabled=false;btn.textContent='SIGN IN'}});
</script><div id="tgsLogin" style="display:none;position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#0d172bfa,#1c3154f5);padding:22px;align-items:center;justify-content:center"><form id="tgsLoginForm" style="width:min(100%,410px);background:#fffdf8;border:1px solid #c9a45c;border-radius:20px;padding:28px;box-shadow:0 25px 80px #0006;color:#18243a"><div style="text-align:center;color:#a98545;font:700 12px Arial;letter-spacing:4px">THE GENERATION SCHOOL</div><h2 style="font:500 27px Georgia;text-align:center;margin:12px 0 5px">Portal Sign In</h2><p style="text-align:center;color:#718096;font:13px Arial;margin:0 0 22px">Use your school account to continue</p><label style="display:block;font:700 12px Arial;margin:12px 0 6px">EMAIL ADDRESS</label><input id="tgsEmail" type="email" required autocomplete="username" placeholder="name@school.com" style="width:100%;padding:13px;border:1px solid #d8d2c5;border-radius:9px;box-sizing:border-box"><label style="display:block;font:700 12px Arial;margin:14px 0 6px">PASSWORD</label><input id="tgsPassword" type="password" required autocomplete="current-password" placeholder="Your password" style="width:100%;padding:13px;border:1px solid #d8d2c5;border-radius:9px;box-sizing:border-box"><p id="tgsLoginMsg" style="color:#a33;font:13px Arial;min-height:18px"></p><button type="submit" style="width:100%;padding:14px;border:0;border-radius:10px;background:linear-gradient(120deg,#b18a4a,#dfc17f);color:#17233b;font-weight:800">SIGN IN</button><a href="./index.html" style="display:block;text-align:center;margin-top:18px;color:#8a713f;font:13px Arial;text-decoration:none">← Back to portal selection</a></form></div></body></html>
