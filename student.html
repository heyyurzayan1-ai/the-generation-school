<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TGS Student Demo</title><style>body{margin:0;background:#f5f3ee;color:#18243a;font:15px Arial}.top{background:#101b32;color:white;padding:24px}.wrap{max-width:850px;margin:25px auto;padding:12px}.panel{background:white;border:1px solid #e8e0d2;border-radius:14px;padding:22px;margin:14px 0}.tag{float:right;background:#fff0c9;color:#795b30;padding:8px;border-radius:20px;font-size:11px}.item{padding:13px;border:1px solid #eee;margin:10px 0;border-radius:9px}button{padding:10px 14px;border:0;border-radius:8px;background:#a78043;color:white;margin:4px}</style><header class="top"><span class="tag">DEMO MODE</span><h2>🎓 The Generation School</h2>Student Learning Portal</header><main class="wrap"><section class="panel"><h2>Welcome, Ayesha Khan</h2><p>Class 5 · Roll No. 501 · Sample student</p></section><div><button onclick="tab('hw')">Homework</button><button onclick="tab('mat')">Study Materials</button><button onclick="tab('sy')">Syllabus</button><button onclick="tab('an')">Announcements</button></div><section id="hw" class="panel"><h2>Class Homework</h2><div id="homework"></div></section><section id="mat" class="panel" hidden><h2>Study Materials</h2><div id="materials"></div></section><section id="sy" class="panel" hidden><h2>Syllabus</h2><div id="syllabus"></div></section><section id="an" class="panel" hidden><h2>Announcements</h2><div id="ann"></div></section></main><script>let d=JSON.parse(localStorage.getItem('tgs-demo-v2')||'null')||{homework:[{class:'Class 5',subject:'Maths',title:'Exercise 3.1',detail:'Solve questions 1-5',due:'2026-11-02'}],materials:[],syllabus:[],announcements:[]};let esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function tab(id){['hw','mat','sy','an'].forEach(x=>document.getElementById(x).hidden=x!==id)}function render(id,arr){document.getElementById(id).innerHTML=arr.filter(x=>!x.class||x.class==='Class 5').map(x=>'<div class="item"><b>'+esc(x.subject||x.title||x.chapter)+' · '+esc(x.title||x.chapter||'')+'</b><p>'+esc(x.detail||x.message||'')+'</p>'+(x.url?'<a href="'+esc(x.url)+'" target="_blank">Open resource</a>':'')+(x.due?'<small> Due: '+esc(x.due)+'</small>':'')+'</div>').join('')||'<p>No items uploaded yet.</p>'}render('homework',d.homework);render('materials',d.materials);render('syllabus',d.syllabus||[]);render('ann',d.announcements||[]);</script></html>
