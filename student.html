<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TGS Student Portal</title><style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f1f5f9;color:#172033}.top{background:#10213e;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:900px;margin:20px auto;padding:0 14px}.panel{background:white;padding:18px;border-radius:12px;margin:14px 0}button{padding:10px 15px;background:#1e40af;color:white;border:0;border-radius:8px}article{padding:12px 0;border-bottom:1px solid #ddd}.muted{color:#64748b}</style></head><body><header class="top"><b>🎓 TGS Student Portal</b><button id="logout">Logout</button></header><main class="wrap"><div id="status" class="panel">Checking secure login…</div><section class="panel"><h2 id="welcome">Student Dashboard</h2><p id="class"></p></section><section class="panel"><h3>Homework</h3><div id="homework">Loading…</div></section><section class="panel"><h3>Study Materials</h3><div id="materials">Loading…</div></section><section class="panel"><h3>Announcements</h3><div id="announcements">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0"></script><script src="./supabase-config.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db,user,student;
async function start(){if(!window.supabase||!window.TGS_SUPABASE_URL||!window.TGS_SUPABASE_PUBLISHABLE_KEY)throw Error('Secure connection unavailable.');db=window.supabase.createClient(TGS_SUPABASE_URL,TGS_SUPABASE_PUBLISHABLE_KEY);const {data,error}=await db.auth.getUser();if(error||!data.user){location.replace('index.html');return}user=data.user;const p=await db.from('profiles').select('role,full_name').eq('id',user.id).maybeSingle();if(p.error||!p.data||p.data.role!=='student'){await db.auth.signOut();location.replace('index.html');return}const s=await db.from('students').select('id,full_name,class_name,roll_number').eq('user_id',user.id).maybeSingle();if(s.error||!s.data){$('status').textContent='Your student record is not linked yet. Please contact school administration.';return}student=s.data;$('status').textContent='Securely connected to school records.';$('welcome').textContent='Welcome, '+esc(student.full_name);$('class').textContent=esc(student.class_name)+' · Roll No: '+esc(student.roll_number);const [h,m,a]=await Promise.all([db.from('homework').select('subject,title,details,due_date,created_at').eq('class_name',student.class_name).order('created_at',{ascending:false}),db.from('study_materials').select('subject,title,file_url,created_at').eq('class_name',student.class_name).order('created_at',{ascending:false}),db.from('announcements').select('title,body,audience,created_at').in('audience',['all','students']).order('created_at',{ascending:false})]);if(h.error||m.error||a.error)throw Error('Could not load school data.');$('homework').innerHTML=h.data.map(x=>'<article><b>'+esc(x.subject)+' — '+esc(x.title)+'</b><p>'+esc(x.details)+'</p><small>Due: '+esc(x.due_date||'Not set')+'</small></article>').join('')||'No homework assigned.';$('materials').innerHTML=m.data.map(x=>'<article><b>'+esc(x.subject)+' — '+esc(x.title)+'</b><p><a href="'+esc(x.file_url)+'" target="_blank" rel="noopener">Open material</a></p></article>').join('')||'No study materials shared.';$('announcements').innerHTML=a.data.map(x=>'<article><b>'+esc(x.title)+'</b><p>'+esc(x.body)+'</p></article>').join('')||'No announcements.'}
$('logout').onclick=async()=>{if(db)await db.auth.signOut();location.replace('index.html')};start().catch(e=>{$('status').textContent=e.message});
</script></body></html>
