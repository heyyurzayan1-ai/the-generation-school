<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TGS Teacher Portal</title><style>
*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;background:#f1f5f9;color:#172033}.top{background:#14264a;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}.wrap{max-width:950px;margin:20px auto;padding:0 14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button,.btn{border:0;border-radius:8px;padding:12px 16px;background:#1e40af;color:white}.panel{background:white;padding:20px;border-radius:13px;margin:14px 0;box-shadow:0 3px 12px #0001}input,select,textarea{display:block;width:100%;padding:12px;margin:8px 0 14px;border:1px solid #cbd5e1;border-radius:8px}label{font-weight:bold;font-size:14px}.item{border:1px solid #e2e8f0;padding:14px;border-radius:9px;margin:10px 0;overflow-wrap:anywhere}.muted{color:#64748b}.hidden{display:none}button{cursor:pointer}#status{padding:10px;border-radius:8px;background:#eff6ff;margin:10px 0}
</style></head><body>
<header class="top"><div><b>🎓 THE GENERATION SCHOOL</b><div>Teacher Portal</div></div><div id="who">Connecting…</div><button class="btn" id="logout">Logout</button></header>
<main class="wrap"><div id="status">Connecting securely to school database…</div>
<div class="tabs"><button data-tab="dash">Dashboard</button><button data-tab="hw">Daily Homework</button><button data-tab="mat">Study Materials</button><button data-tab="ann">Announcements</button></div>
<section id="dash" class="panel"><h2>Teacher Dashboard</h2><p id="summary" class="muted">Loading your school records…</p></section>
<section id="hw" class="panel hidden"><h2>Publish Daily Homework</h2><form id="hwForm"><label>Class</label><select id="hwClass" required></select><label>Subject</label><input id="hwSubject" required placeholder="e.g. Mathematics"><label>Homework title</label><input id="hwTitle" required placeholder="Today's homework"><label>Details</label><textarea id="hwDetails" placeholder="Write homework instructions"></textarea><label>Due date</label><input id="hwDate" type="date"><button class="btn">Save homework</button></form><h3>Published homework</h3><div id="hwList"></div></section>
<section id="mat" class="panel hidden"><h2>Add Study Material</h2><form id="matForm"><label>Class</label><select id="matClass" required></select><label>Subject</label><input id="matSubject" required><label>Title</label><input id="matTitle" required><label>Google Drive / file link</label><input id="matLink" type="url" required placeholder="https://…"><button class="btn">Save material link</button></form><h3>Saved materials</h3><div id="matList"></div></section>
<section id="ann" class="panel hidden"><h2>School Announcements</h2><div id="annList"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>
const db=supabase.createClient(window.TGS_SUPABASE_URL,window.TGS_SUPABASE_PUBLISHABLE_KEY);
const classes=['Playgroup','Nursery','Prep',...Array.from({length:10},(_,i)=>'Class '+(i+1))];
for(const id of ['hwClass','matClass'])document.getElementById(id).innerHTML='<option value="">Select class</option>'+classes.map(c=>'<option>'+c+'</option>').join('');
const el=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(s){el('status').textContent=s}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));el(b.dataset.tab).classList.remove('hidden')});
async function start(){const {data:{user},error}=await db.auth.getUser();if(error||!user){location.replace('./index.html');return}const {data:p,error:pe}=await db.from('profiles').select('full_name,role,class_name').eq('id',user.id).single();if(pe||!p){status('School account could not be verified. Please sign in again.');return}if(p.role!=='teacher'){const routes={admin:'admin.html',student:'student.html',parent:'parent.html'};if(routes[p.role]){location.replace('./'+routes[p.role]+'?v=20261031');return}status('Access denied. Contact school administration.');return}el('who').textContent=p.full_name||user.email;status('Connected to live school database.');await load()}
async function load(){const [h,m,a]=await Promise.all([db.from('homework').select('*').order('created_at',{ascending:false}).limit(50),db.from('study_materials').select('*').order('created_at',{ascending:false}).limit(50),db.from('announcements').select('*').order('created_at',{ascending:false}).limit(30)]);if(h.error||m.error||a.error){status('Database error: '+(h.error||m.error||a.error).message);return}el('summary').textContent=h.data.length+' homework posts • '+m.data.length+' study materials • '+a.data.length+' announcements';el('hwList').innerHTML=h.data.map(x=>'<div class="item"><b>'+esc(x.class_name)+' — '+esc(x.subject)+': '+esc(x.title)+'</b><p>'+esc(x.details)+'</p><small>Due: '+esc(x.due_date||'Not set')+'</small></div>').join('')||'<p class="muted">No homework yet.</p>';el('matList').innerHTML=m.data.map(x=>'<div class="item"><b>'+esc(x.class_name||'All classes')+' — '+esc(x.subject)+': '+esc(x.title)+'</b><p><a href="'+esc(x.file_url)+'" target="_blank" rel="noopener">Open material</a></p></div>').join('')||'<p class="muted">No materials yet.</p>';el('annList').innerHTML=a.data.map(x=>'<div class="item"><b>'+esc(x.title)+'</b><p>'+esc(x.body)+'</p></div>').join('')||'<p class="muted">No announcements.</p>'}
el('hwForm').onsubmit=async e=>{e.preventDefault();const {data:{user}}=await db.auth.getUser();const {error}=await db.from('homework').insert({class_name:el('hwClass').value,subject:el('hwSubject').value.trim(),title:el('hwTitle').value.trim(),details:el('hwDetails').value.trim(),due_date:el('hwDate').value||null,created_by:user.id});if(error){status('Could not save homework: '+error.message);return}e.target.reset();status('Homework saved in the database.');await load()};
el('matForm').onsubmit=async e=>{e.preventDefault();const {data:{user}}=await db.auth.getUser();const {error}=await db.from('study_materials').insert({class_name:el('matClass').value,subject:el('matSubject').value.trim(),title:el('matTitle').value.trim(),file_url:el('matLink').value.trim(),created_by:user.id});if(error){status('Could not save material: '+error.message);return}e.target.reset();status('Material link saved in the database.');await load()};
el('logout').onclick=async()=>{await db.auth.signOut();location.replace('./index.html')};start();
</script></body></html>
