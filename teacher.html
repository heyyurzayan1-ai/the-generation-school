<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TGS Teacher Demo</title><style>body{margin:0;background:#f5f3ee;font:15px Arial;color:#18243a}.top{background:#101b32;color:white;padding:24px}.wrap{max-width:850px;margin:25px auto;padding:12px}.panel{background:white;border:1px solid #e8e0d2;border-radius:14px;padding:22px;margin:14px 0}button{padding:11px 15px;border:0;border-radius:8px;background:#a78043;color:white;margin:4px;cursor:pointer}input,select,textarea{display:block;width:100%;padding:11px;margin:8px 0 15px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.tag{float:right;color:#795b30;background:#fff0c9;padding:8px;border-radius:20px;font-size:11px}.item{padding:12px;border:1px solid #eee;margin:9px 0;border-radius:9px}</style><header class="top"><span class="tag">DEMO MODE</span><h2>🎓 The Generation School</h2>Teacher Workspace</header><main class="wrap"><div><button onclick="tab('dash')">Dashboard</button><button onclick="tab('hw')">Send Homework</button><button onclick="tab('mat')">Study Materials</button></div><section id="dash" class="panel"><h2>Teacher Dashboard</h2><p id="stats"></p><p>Homework you publish appears in the matching class student demo portal on this browser.</p></section><section id="hw" class="panel" hidden><h2>Publish Homework</h2><form id="hf">Class<select id="cl"></select>Subject<input id="sub" required>Title<input id="ttl" required>Instructions<textarea id="det"></textarea>Due date<input id="due" type="date"><button>Publish homework</button></form><div id="list"></div></section><section id="mat" class="panel" hidden><h2>Share Study Material</h2><form id="mf">Class<select id="mc"></select>Subject<input id="ms" required>Title<input id="mt" required>File link<input id="url" type="url" required><button>Share resource</button></form><div id="ml"></div></section></main><script>const k='tgs-demo-v2';let d=JSON.parse(localStorage.getItem(k)||'null')||{classes:['Class 1','Class 2','Class 3','Class 4','Class 5'],homework:[],materials:[],students:[]};let save=()=>localStorage.setItem(k,JSON.stringify(d));['cl','mc'].forEach(id=>document.getElementById(id).innerHTML=d.classes.map(x=>'<option>'+x+'</option>').join(''));function tab(id){['dash','hw','mat'].forEach(x=>document.getElementById(x).hidden=x!==id)}function draw(){document.getElementById('stats').textContent=d.homework.length+' homework posts · '+d.materials.length+' resources';document.getElementById('list').innerHTML=d.homework.map(x=>'<div class="item"><b>'+x.class+' · '+x.subject+' — '+x.title+'</b><p>'+x.detail+'</p>Due: '+x.due+'</div>').join('');document.getElementById('ml').innerHTML=d.materials.map(x=>'<div class="item">'+x.class+' · '+x.subject+' — '+x.title+' <a href="'+x.url+'" target="_blank">Open</a></div>').join('')}document.getElementById('hf').onsubmit=e=>{e.preventDefault();d.homework.unshift({class:cl.value,subject:sub.value,title:ttl.value,detail:det.value,due:due.value});save();draw();e.target.reset();alert('Published in demo data')};document.getElementById('mf').onsubmit=e=>{e.preventDefault();d.materials.unshift({class:mc.value,subject:ms.value,title:mt.value,url:url.value});save();draw();e.target.reset()};draw();</script></html>
