<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b32"><title>TGS | Teacher Portal</title><style>
:root{--n:#101b32;--n2:#1c3154;--g:#c9a45c;--paper:#fff;--bg:#f5f3ee;--ink:#18243a;--muted:#718096;--line:#e8e3d8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0%,#eee4ce 0,transparent 28%),var(--bg);font:15px Inter,system-ui,Arial;color:var(--ink)}header{background:linear-gradient(120deg,#0d172b,#1c3154 68%,#263b5d);color:white;padding:22px max(18px,calc((100% - 1180px)/2));border-bottom:3px solid var(--g);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header b{letter-spacing:2px}.demo{font-size:11px;color:#f3d99c;border:1px solid #c9a45c80;border-radius:30px;padding:6px 10px}.layout{max-width:1180px;margin:22px auto;padding:0 16px 45px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav button,button{border:0;border-radius:9px;padding:11px 15px;background:linear-gradient(120deg,#c5a15b,#e1c582);color:#17233b;font-weight:800;cursor:pointer}.nav button{background:#fff;color:var(--n);border:1px solid var(--line)}.nav button.active{background:var(--n);color:#fff}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;margin:12px 0;box-shadow:0 8px 26px #18243a08}.metric{font-size:30px;font-weight:800;color:var(--n)}.muted,small{color:var(--muted)}h1,h2,h3{color:var(--n)}input,select,textarea{width:100%;padding:12px;border:1px solid #d9dfe8;border-radius:9px;margin:6px 0 13px;font:inherit}label{font-size:12px;font-weight:800;color:#536176}form{max-width:720px}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.item{padding:13px;border:1px solid var(--line);border-radius:11px;margin:9px 0;background:#fffdf9}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px}th{color:#876b38}.table{overflow:auto}.notice{background:#fff8e9;border-left:4px solid var(--g);padding:12px;border-radius:8px;margin:12px 0}.hide{display:none!important}@media(max-width:600px){header{padding:18px}.layout{padding:0 11px 30px}.card,.panel{padding:15px}}
</style></head><body><header><div><b>🎓 THE GENERATION SCHOOL</b><div>Teacher Portal</div></div><span class="demo">DEMO MODE · NO LOGIN</span><a href="./index.html" style="color:#f3d99c">Portal Home</a></header><main class="layout"><div class="notice">Teacher demo workspace — no login required. Homework you publish appears in the matching student class demo.</div><nav class="nav"><button class="active" data-page="dash">Dashboard</button><button data-page="post">Send Homework</button><button data-page="materials">Study Materials</button><button data-page="ann">Announcements</button></nav><section class="page active" id="dash"><h2>Teacher Dashboard</h2><div class="grid"><div class="card">My classes<div class="metric" id="tc">0</div></div><div class="card">Homework sent<div class="metric" id="th">0</div></div></div><div id="myPosts"></div></section><section class="page" id="post"><h2>Send classwork / homework</h2><div class="panel"><form id="hwForm"><label>Class</label><select id="hwClass"></select><label>Subject</label><input id="hwSubject" required><label>Title</label><input id="hwTitle" required><label>Instructions / work</label><textarea id="hwDetails" required></textarea><label>Due date</label><input id="hwDue" type="date"><button>Publish to students</button></form></div></section><section class="page" id="materials"><h2>Share study material</h2><form id="matForm"><label>Class</label><select id="matClass"></select><label>Subject</label><input id="matSubject" required><label>Title</label><input id="matTitle" required><label>File / Drive link</label><input id="matUrl" type="url" required><button>Share material</button></form><div id="matList"></div></section><section class="page" id="ann"><h2>School Announcements</h2><div id="annList"></div></section></main><script>const KEY='tgs_demo_v1';const seed={classes:['Playgroup','Nursery','Prep',...Array.from({length:10},(_,i)=>'Class '+(i+1))],students:[{id:1,name:'Demo Student',father:'Demo Parent',className:'Class 5',roll:'D-001',phone:'03000000000'}],teachers:[{id:1,name:'Demo Teacher',subject:'Mathematics',className:'Class 5',phone:'03000000000'}],homework:[{id:1,className:'Class 5',subject:'Mathematics',title:'Fractions practice',details:'Solve exercise 3, questions 1–5.',due:'2026-11-02',by:'Demo Teacher',date:new Date().toISOString()}],materials:[],announcements:[],fees:[],curriculum:[],results:[]};function get(){try{return JSON.parse(localStorage.getItem(KEY))||seed}catch(e){return seed}}function save(d){localStorage.setItem(KEY,JSON.stringify(d))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function options(arr){return arr.map(x=>'<option>'+esc(x)+'</option>').join('')}function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id))}function render(){let d=get();hwClass.innerHTML=options(d.classes);matClass.innerHTML=options(d.classes);tc.textContent=new Set(d.teachers.map(t=>t.className)).size||d.classes.length;th.textContent=d.homework.length;myPosts.innerHTML=d.homework.map(h=>'<div class="item"><b>'+esc(h.className)+' · '+esc(h.subject)+': '+esc(h.title)+'</b><p>'+esc(h.details)+'</p></div>').join('')||'No homework posted';matList.innerHTML=d.materials.map(x=>'<div class="item">'+esc(x.title)+' · '+esc(x.className)+' <a href="'+esc(x.url)+'" target="_blank">Open</a></div>').join('');annList.innerHTML=d.announcements.map(x=>'<div class="item"><b>'+esc(x.title)+'</b><p>'+esc(x.body)+'</p></div>').join('')||'No announcements'}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));hwForm.onsubmit=e=>{e.preventDefault();let d=get();d.homework.unshift({id:Date.now(),className:hwClass.value,subject:hwSubject.value,title:hwTitle.value,details:hwDetails.value,due:hwDue.value,by:'Demo Teacher',date:new Date().toISOString()});save(d);e.target.reset();render();alert('Homework published to '+hwClass.value+' demo student view.')};matForm.onsubmit=e=>{e.preventDefault();let d=get();d.materials.push({className:matClass.value,subject:matSubject.value,title:matTitle.value,url:matUrl.value});save(d);e.target.reset();render()};render();</script></body></html>
