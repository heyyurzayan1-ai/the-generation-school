<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TGS Parent Portal</title><style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f1f5f9;color:#172033}.top{background:#10213e;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:900px;margin:20px auto;padding:0 14px}.panel{background:white;padding:18px;border-radius:12px;margin:14px 0}button{padding:10px 15px;background:#1e40af;color:white;border:0;border-radius:8px}article{padding:12px 0;border-bottom:1px solid #ddd}</style></head><body><header class="top"><b>👨‍👩‍👧 TGS Parent Portal</b><button id="logout">Logout</button></header><main class="wrap"><div id="status" class="panel">Checking secure login…</div><section class="panel"><h2 id="welcome">Parent Dashboard</h2><p id="child"></p></section><section class="panel"><h3>Homework</h3><div id="homework">Loading…</div></section><section class="panel"><h3>Study Materials</h3><div id="materials">Loading…</div></section><section class="panel"><h3>Announcements</h3><div id="announcements">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0"></script><script src="./supabase-config.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db;
async function start(){if(!window.supabase||!window.TGS_SUPABASE_URL||!window.TGS_SUPABASE_PUBLISHABLE_KEY)throw Error('Secure connection unavailable.');db=window.supabase.createClient(TGS_SUPABASE_URL,TGS_SUPABASE_PUBLISHABLE_KEY);const {data,error}=await db.auth.getUser();if(error||!data.user){location.replace('index.html');return}const p=await db.from('profiles').select('role,full_name').eq('id',data.user.id).maybeSingle();if(p.error||!p.data){await db.auth.signOut();location.replace('./index.html?v=20261031');return}if(p.data.role!=='parent'){const routes={admin:'admin.html',teacher:'teacher.html',student:'student.html'};if(routes[p.data.role]){location.replace('./'+routes[p.data.role]+'?v=20261031');return}await db.auth.signOut();location.replace('./index.html?v=20261031');return}const link=await db.from('parent_students').select('student_id').eq('parent_id',data.user.id);if(link.error)throw Error('Parent account is not linked to a student yet. Contact school administration.');if(!link.data.length){$('status').textContent='No child is linked to this parent account yet.';return}const ids=link.data.map(x=>x.student_id);const s=await db.from('students').select('id,full_name,class_name,roll_number').in('id',ids);if(s.error||!s.data.length)throw Error('Linked student record could not be loaded.');const classes=[...new Set(s.data.map(x=>x.class_name))];$('welcome').textContent='Welcome, '+esc(p.data.full_name||'Parent');$('child').textContent=s.data.map(x=>esc(x.full_name)+' · '+esc(x.class_name)+' · Roll '+esc(x.roll_number)).join('<br>');const [h,m,a]=await Promise.all([db.from('homework').select('class_name,subject,title,details,due_date').in('class_name',classes).order('created_at',{ascending:false}),db.from('study_materials').select('class_name,subject,title,file_url').in('class_name',classes).order('created_at',{ascending:false}),db.from('announcements').select('title,body').in('audience',['all','parents']).order('created_at',{ascending:false})]);if(h.error||m.error||a.error)throw Error('Could not load school data.');$('status').textContent='Securely connected to linked student records.';$('homework').innerHTML=h.data.map(x=>'<article><b>'+esc(x.class_name)+' · '+esc(x.subject)+' — '+esc(x.title)+'</b><p>'+esc(x.details)+'</p><small>Due: '+esc(x.due_date||'Not set')+'</small></article>').join('')||'No homework.';$('materials').innerHTML=m.data.map(x=>'<article><b>'+esc(x.class_name)+' · '+esc(x.subject)+' — '+esc(x.title)+'</b><p><a href="'+esc(x.file_url)+'" target="_blank" rel="noopener">Open material</a></p></article>').join('')||'No materials.';$('announcements').innerHTML=a.data.map(x=>'<article><b>'+esc(x.title)+'</b><p>'+esc(x.body)+'</p></article>').join('')||'No announcements.'}
$('logout').onclick=async()=>{if(db)await db.auth.signOut();location.replace('index.html')};start().catch(e=>{$('status').textContent=e.message});
</script></body></html>
