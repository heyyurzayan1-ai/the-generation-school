<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TGS Admin Demo</title><style>:root{--navy:#101b32;--navy2:#1c3154;--gold:#c9a45c;--bg:#f4f3ef;--line:#e7e2d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1b2940;font:15px Inter,system-ui,Arial}.side{position:fixed;inset:0 auto 0 0;width:235px;background:linear-gradient(180deg,#0d172b,#1c3154);color:white;padding:20px 14px;overflow:auto;border-right:3px solid var(--gold)}.side h2{color:#ead29b;letter-spacing:3px;padding:0 10px}.side button{display:block;width:100%;padding:12px;margin:4px 0;background:transparent;color:#e8edf5;border:0;text-align:left;border-radius:9px;font-weight:600}.side button.on,.side button:hover{background:#b18a4a;color:#101b32}.main{margin-left:235px;padding:28px;max-width:1500px}.tag{background:#fff0c9;color:#795b30;padding:8px 12px;border-radius:20px;float:right;font-size:10px;font-weight:900;letter-spacing:1px}.panel{background:white;padding:20px;margin:14px 0;border:1px solid var(--line);border-radius:15px;box-shadow:0 8px 24px #18243a08}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}.metric{font:34px Georgia;color:#101b32;margin-top:8px}input,select,textarea{padding:12px;border:1px solid #dce1e8;border-radius:8px;width:100%;margin:6px 0 12px;font:inherit}label{font-size:12px;font-weight:800;color:#536176}button,.btn{cursor:pointer}form button{background:linear-gradient(120deg,#c5a15b,#e1c582);color:#17233b;padding:12px 16px;border:0;border-radius:8px;font-weight:800}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:11px;border-bottom:1px solid #eee;font-size:13px}th{color:#876b38}section{display:none}section.on{display:block}h1{color:var(--navy);font:500 30px Georgia}h3{color:var(--navy)}#view> .panel:first-child{margin-top:18px}@media(max-width:760px){.side{position:static;width:auto;padding:10px;border-right:0;border-bottom:3px solid var(--go const names=['Dashboard','Students','Teachers','Classes','Syllabus','Homework','Materials','Attendance','Exams & Results','Fee Structure','Announcements','School Settings'],key='tgs-demo-v2';let d=JSON.parse(localStorage.getItem(key)||'null')||{students:[{name:'Ayesha Khan',class:'Class 5',roll:'501',father:'Ahmed Khan',phone:'03001234567'},{name:'Ali Raza',class:'Class 4',roll:'402',father:'Raza Ahmed',phone:'03007654321'}],teachers:[{name:'Ms Fatima',subject:'English',classes:'Class 4,5',phone:'03001112222'}],classes:['Playgroup','Nursery','Prep',...Array.from({length:10},(_,i)=>'Class '+(i+1))],syllabus:[{class:'Class 5',subject:'Science',chapter:'Plants and their parts'}],homework:[{class:'Class 5',subject:'Mathematics',title:'Exercise 3.1',detail:'Solve questions 1-5',due:'2026-11-02'}],materials:[],attendance:[],exams:[],fees:[],announcements:[{title:'Welcome to TGS Demo',message:'Explore the digital learning portal.'}],settings:{school:'The Generation School',principal:'',owner:'',phone:''}};const save=()=>localStorage.setItem(key,JSON.stringify(d)),e=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let current=0;document.getElementById('nav').innerHTML=names.map((n,i)=>'<button data-i="'+i+'">'+['▦','♙','♟','▦','▤','✎','▧','✓','✎','৳','⚑','⚙'][i]+' '+n+'</button>').join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>show(+b.dataset.i));function show(i){current=i;document.querySelectorAll('[data-i]').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));document.getElementById('title').textContent=names[i];let data=[[],d.students,d.teachers,d.classes,d.syllabus,d.homework,d.materials,d.attendance,d.exams,d.fees,d.announcements,[]][i],fields=[[],['name','class','roll'],['name','subject','classes'],['name'],['class','subject','chapter'],['class','subject','title','detail','due'],['class','subject','title','url'],['class','name','status','date'],['name','exam','subject','marks'],['class','admission'
