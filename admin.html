<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TGS Admin Demo</title><style>body{margin:0;background:#f5f3ee;color:#1b2b43;font:15px Arial}.side{position:fixed;inset:0 auto 0 0;width:190px;background:#101b32;color:white;padding:18px;overflow:auto}.side h2{color:#dfc58e}.side button{display:block;width:100%;padding:12px;margin:4px 0;background:transparent;color:white;border:0;text-align:left;border-radius:8px}.side button.on,.side button:hover{background:#b18a4a}.main{margin-left:220px;padding:24px}.tag{background:#fff0c9;color:#795b30;padding:8px;border-radius:20px;float:right;font-size:11px}.panel{background:white;padding:18px;margin:14px 0;border:1px solid #e8e0d2;border-radius:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.metric{font:32px Georgia;color:#101b32}input,select,textarea{padding:10px;border:1px solid #ddd;border-radius:7px;width:100%;margin:5px 0 12px;box-sizing:border-box}button,.btn{cursor:pointer}form button{background:#a78043;color:white;padding:11px 15px;border:0;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #eee}section{display:none}section.on{display:block}@media(max-width:650px){.side{width:55px;padding:8px}.side h2{font-size:12px}.side button{font-size:0;text-align:center;padding:12px 2px}.main{margin-left:70px;padding:12px}}</style><aside class="side"><h2>TGS</h2><div id="nav"></div></aside><main class="main"><span class="tag">OPEN DEMO · SAMPLE DATA</span><h1 id="title">Dashboard</h1><div id="view"></div></main><script>
const names=['Dashboard','Students','Teachers','Classes','Syllabus','Homework','Materials','Attendance','Exams & Results','Fee Structure','Announcements','School Settings'],key='tgs-demo-v2';let d=JSON.parse(localStorage.getItem(key)||'null')||{students:[{name:'Ayesha Khan',class:'Class 5',roll:'501'},{name:'Ali Raza',class:'Class 4',roll:'402'}],teachers:[{name:'Ms Fatima',subject:'English',classes:'Class 4,5'}],classes:['Playgroup','Nursery','Prep',...Array.from({length:10},(_,i)=>'Class '+(i+1))],syllabus:[],homework:[{class:'Class 5',subject:'Maths',title:'Exercise 3.1',detail:'Solve questions 1-5',due:'2026-11-02'}],materials:[],attendance:[],exams:[],fees:[],announcements:[],settings:{school:'The Generation School',principal:'',owner:'',phone:''}};const save=()=>localStorage.setItem(key,JSON.stringify(d)),e=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let current=0;document.getElementById('nav').innerHTML=names.map((n,i)=>'<button data-i="'+i+'">'+['▦','♙','♟','▦','▤','✎','▧','✓','✎','৳','⚑','⚙'][i]+' '+n+'</button>').join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>show(+b.dataset.i));function show(i){current=i;document.querySelectorAll('[data-i]').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));document.getElementById('title').textContent=names[i];let data=[[],d.students,d.teachers,d.classes,d.syllabus,d.homework,d.materials,d.attendance,d.exams,d.fees,d.announcements,[]][i],fields=[[],['name','class','roll'],['name','subject','classes'],['name'],['class','subject','chapter'],['class','subject','title','detail','due'],['class','subject','title','url'],['name','status','date'],['name','exam','subject','marks'],['class','admission','monthly'],['title','message'],['school','principal','owner','phone']][i];let html='';if(i===0)html='<div class="grid">'+[['Students',d.students.length],['Teachers',d.teachers.length],['Classes',d.classes.length],['Homework',d.homework.length],['Materials',d.materials.length],['Results',d.exams.length]].map(x=>'<div class="panel">'+x[0]+'<div class="metric">'+x[1]+'</div></div>').join('')+'</div><div class="panel">Admin manages classes, teachers, syllabus, fee structure and school notices. Teachers publish homework; students see it in their portal.</div>';else{html='<div class="panel"><h3>Add / Update '+names[i]+'</h3><form id="f" class="grid">'+fields.map((f,j)=>'<label>'+f+'<input id="f'+j+'" '+(f==='due'||f==='date'?'type="date"':'')+' required></label>').join('')+'<button>Save</button></form></div><div class="panel"><input id="search" placeholder="Search records..."><div style="overflow:auto"><table><tbody>'+data.map(x=>'<tr>'+Object.values(x).map(v=>'<td>'+e(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></div>'}document.getElementById('view').innerHTML=html;let f=document.getElementById('f');if(f)f.onsubmit=ev=>{ev.preventDefault();let o={};fields.forEach((k,j)=>o[k]=document.getElementById('f'+j).value);if(i===3)d.classes.push(o.name);else if(i===11)Object.assign(d.settings,o);else data.unshift(o);save();show(i)};let s=document.getElementById('search');if(s)s.oninput=()=>document.querySelectorAll('tbody tr').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(s.value.toLowerCase()))}show(0);
</script></main></html>
