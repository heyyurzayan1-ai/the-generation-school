<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TGS School Login</title><link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#123b70">
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#10213e,#2563eb);display:grid;place-items:center;padding:18px}
.card{background:white;width:100%;max-width:440px;padding:28px;border-radius:18px;box-shadow:0 18px 55px #0004}
.logo{text-align:center;color:#1e40af;font-size:30px;font-weight:bold}
h1{text-align:center;color:#10213e;margin:10px 0 5px;font-size:24px}
.sub{text-align:center;color:#64748b;margin:0 0 24px;font-size:13px}
.role-list{display:grid;gap:12px}
.role-btn{width:100%;padding:16px;border:1px solid #dbeafe;border-radius:10px;background:#eff6ff;color:#173b75;font-weight:bold;font-size:16px;text-align:left;cursor:pointer;margin:0}
.role-btn:active{background:#dbeafe}
label{display:block;font-weight:bold;font-size:13px;margin:15px 0 7px}
input,button{width:100%;padding:14px;border-radius:9px;font-size:15px}
input{border:1px solid #cbd5e1}
.login-btn{border:0;background:#1e40af;color:white;font-weight:bold;margin-top:20px;cursor:pointer}
.back{border:0;background:#e2e8f0;color:#1e293b;margin:0 0 10px;cursor:pointer;font-weight:bold}
#loginArea[hidden],#roleArea[hidden]{display:none}
#message{font-size:13px;line-height:1.5;margin-top:15px;color:#b91c1c;min-height:18px}
.foot{text-align:center;color:#64748b;font-size:12px;margin-top:20px}
.selected{font-size:16px;font-weight:bold;color:#1e40af;margin:0 0 12px}
</style>
</head>
<body>
<main class="card">
<div class="logo">TGS</div><h1>The Generation School</h1><p class="sub">School Management System</p>
<section id="roleArea">
<p class="sub">Please select who is logging in</p>
<div class="role-list">
<button class="role-btn" type="button" data-role="admin">👨‍💼 &nbsp; Administrator</button>
<button class="role-btn" type="button" data-role="teacher">👨‍🏫 &nbsp; Teacher</button>
<button class="role-btn" type="button" data-role="student">🎓 &nbsp; Student</button>
<button class="role-btn" type="button" data-role="parent">👨‍👩‍👧 &nbsp; Parents</button>
</div>
</section>
<section id="loginArea" hidden>
<button class="back" id="backBtn" type="button">← Back to options</button>
<p class="selected" id="selectedRole"></p>
<form id="loginForm">
<label for="email">Email</label><input id="email" type="email" autocomplete="username" required placeholder="Your school email">
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Your password">
<button class="login-btn" id="loginBtn" type="submit">Sign in securely</button>
</form>
</section>
<p id="message" role="status"></p><p class="foot">Authorized school accounts only · TGS © 2026</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0"></script>
<script src="./supabase-config.js"></script>
<script>
const msg=document.getElementById('message');
const btn=document.getElementById('loginBtn');
const form=document.getElementById('loginForm');
const roleArea=document.getElementById('roleArea');
const loginArea=document.getElementById('loginArea');
const selectedRoleText=document.getElementById('selectedRole');
let selectedRole='';
let db=null;
const roleNames={admin:'Administrator',teacher:'Teacher',student:'Student',parent:'Parents'};
document.querySelectorAll('[data-role]').forEach(button=>{
 button.addEventListener('click',()=>{
  selectedRole=button.dataset.role;
  selectedRoleText.textContent=roleNames[selectedRole]+' Login';
  roleArea.hidden=true;loginArea.hidden=false;msg.textContent='';
 });
});
document.getElementById('backBtn').addEventListener('click',()=>{
 loginArea.hidden=true;roleArea.hidden=false;form.reset();msg.textContent='';btn.disabled=false;btn.textContent='Sign in securely';
});
if(!window.supabase||!window.TGS_SUPABASE_URL||!window.TGS_SUPABASE_PUBLISHABLE_KEY){
 msg.textContent='Secure connection unavailable. Please contact the school administrator.';
}else{
 db=window.supabase.createClient(window.TGS_SUPABASE_URL,window.TGS_SUPABASE_PUBLISHABLE_KEY,{
  auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}
 });
 form.addEventListener('submit',async e=>{
  e.preventDefault();
  if(!db||!selectedRole)return;
  btn.disabled=true;btn.textContent='Verifying account…';msg.textContent='';
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  try{
   const {data,error}=await db.auth.signInWithPassword({email,password});
   if(error||!data||!data.user){
    msg.textContent='Email or password is incorrect.';
    await db.auth.signOut();btn.disabled=false;btn.textContent='Sign in securely';return;
   }
   const {data:profile,error:profileError}=await db.from('profiles').select('role').eq('id',data.user.id).maybeSingle();
   const pages={admin:'admin.html',teacher:'teacher.html',student:'student.html',parent:'parent.html'};
   if(profileError||!profile||!pages[profile.role]){
    await db.auth.signOut();msg.textContent='This account has no active school role. Contact the administrator.';
    btn.disabled=false;btn.textContent='Sign in securely';return;
   }
   if(profile.role!==selectedRole){
    await db.auth.signOut();msg.textContent='This account is not registered as '+roleNames[selectedRole]+'. Please select the correct option.';
    btn.disabled=false;btn.textContent='Sign in securely';return;
   }
   location.replace(pages[profile.role]);
  }catch(err){
   await db.auth.signOut();
   msg.textContent='Login could not be verified. Check your internet and try again.';
   btn.disabled=false;btn.textContent='Sign in securely';
  }
 });
}
</script>
</body></html>
