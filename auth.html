<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TGS Secure Access</title><style>:root{--n:#101b32;--g:#c9a45c;--bg:#f4f3ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui;color:#1b2940}header{background:linear-gradient(120deg,#0c172b,#1c3154);color:white;text-align:center;padding:28px;border-bottom:3px solid var(--g)}h1{font:500 28px Georgia;margin:0}.wrap{max-width:520px;margin:30px auto;padding:0 15px}.card{background:white;padding:22px;border:1px solid #e7e2d8;border-radius:16px}.tabs{display:flex;gap:8px}.tabs button,button{padding:12px 15px;border:0;border-radius:9px;background:linear-gradient(120deg,#c5a15b,#e1c582);font-weight:800;cursor:pointer}.tabs button{flex:1;background:#eee;color:var(--n)}.tabs .active{background:var(--n);color:white}.form{display:none}.form.active{display:block}label{display:block;font-size:12px;font-weight:800;margin:13px 0 5px}input,select{width:100%;padding:12px;border:1px solid #dce1e8;border-radius:9px;font:inherit}.wide{width:100%;margin-top:18px}.msg{display:none;background:#fff8e9;padding:12px;border-radius:9px;margin:12px 0;line-height:1.5}.muted{color:#738096;font-size:12px;line-height:1.5}.back{display:block;text-align:center;margin:18px;color:#987638}</style></head><body><header><h1>THE GENERATION SCHOOL</h1><p>SECURE PORTAL ACCESS</p></header><main class="wrap"><div class="card"><div class="tabs"><button id="lt" class="active" type="button">Sign In</button><button id="st" type="button">Sign Up</button></div><div id="msg" class="msg"></div><form id="login" class="form active"><h2 id="loginTitle">Welcome Back</h2><label>Email</label><input id="le" type="email" required><label>Password</label><input id="lp" type="password" required><button class="wide">Sign In</button></form><form id="signup" class="form"><h2 id="signupTitle">Create Account</h2><label>Account type</label><select id="role"><option value="student">Student</option><option value="teacher">Teacher</option><option value="admin">Admin (approval required)</option></select><label>Full name</label><input id="name" required><label>Email</label><input id="email" type="email" required><label>Password (minimum 8 characters)</label><input id="pw" type="password" minlength="8" required><button class="wide">Submit Registration</button><p class="muted">Verify your email from the message we send. Your account remains pending until an administrator approves it. Admin access also requires approval by an existing administrator.</p></form></div><a class="back" href="./index.html">← TGS Home</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script><script src="./supabase-config.js"></script><script src="./auth.js"></script></body></html>
