<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TGS Create Login</title><style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#eef3f9;min-height:100vh;display:grid;place-items:center;padding:18px}.card{background:white;padding:26px;border-radius:16px;width:100%;max-width:430px}label{display:block;margin:14px 0;font-weight:bold}input{display:block;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;margin-top:6px}button{width:100%;padding:13px;background:#1e40af;color:white;border:0;border-radius:8px;font-weight:bold}#msg{padding:12px;background:#e0f2fe;color:#075985;border-radius:8px;display:none;margin-top:14px}.muted{color:#64748b;font-size:13px}</style></head><body><main class="card"><h2>🎓 TGS — Create Login</h2><p class="muted">Create your own account. School admin will assign your role and link your school record. Never share your password.</p><form id="signup"><label>Full name<input id="name" required></label><label>Email<input id="email" type="email" required></label><label>Password (minimum 8 characters)<input id="password" type="password" minlength="8" required></label><button>Create account</button></form><div id="msg"></div><p><a href="./index.html">Back to login</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0"></script><script src="./supabase-config.js"></script><script>const db=window.supabase.createClient(window.TGS_SUPABASE_URL,window.TGS_SUPABASE_PUBLISHABLE_KEY),msg=document.getElementById("msg");document.getElementById("signup").addEventListener("submit",async e=>{e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;const{data,error}=await db.auth.signUp({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value,options:{data:{full_name:document.getElementById("name").value.trim()},emailRedirectTo:location.origin+location.pathname.replace("signup.html","index.html")}});msg.style.display="block";if(error){msg.style.background="#fee2e2";msg.style.color="#991b1b";msg.textContent=error.message}else{msg.textContent=data.session?"Account created. Return to login.":"Registration received. Check your email to confirm, then ask school admin to assign your role." ;e.target.reset()}b.disabled=false});</script></body></html>
